# Claude：@claude 机器人 —— 在 Issue/PR 评论里 @claude 即可让它干活
# 官方仓库：https://github.com/anthropics/claude-code-action
# 前提（二选一，见 docs/SETUP.md 第 6 步）：
#   A. Claude GitHub App（推荐）：本地 claude 终端运行 /install-github-app
#   B. API Key：仓库 Settings → Secrets → Actions 添加 ANTHROPIC_API_KEY
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # 仅当评论中包含 @claude 时触发，平时零消耗
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@beta
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

# 用法示例：
#   "@claude 帮我实现 #12 这个 issue，并附测试，开一个 PR"
#   "@claude 这个 PR 的第 3 个提交有问题吗？"
#   "@claude 修复 CI 失败的原因并推送"
