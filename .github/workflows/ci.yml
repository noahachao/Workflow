# CI：lint + 测试 + 构建冒烟
# 触发：所有指向 main 的 PR + main 上的直接 push
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一 PR 新 push 时取消旧任务，省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # 最小权限原则

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1 # 自动安装并运行 .pre-commit-config.yaml 里全部 hooks（该仓库无 v3 浮动 tag，必须 pin 小版本）

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24] # 24 为当前 LTS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # 统一 npm 大版本：npm 10/11 对 lock 的树校验不兼容
      # （lock 常由本地 npm 11 生成，CI 若用 npm 10 会报 Missing: xxx）
      - run: npm install -g npm@11
      - run: npm ci || npm install
      - run: npm test

  build:
    name: Build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # 可选：构建产物上传（供 release / 部署 job 复用）
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
