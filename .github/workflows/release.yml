# Release：打 tag → 测试 → 构建 → GitHub Release → 部署（CD 挂载点）
# 用法：git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # 创建 Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 统一 npm 大版本，避免与本地 lock 生成版本分裂（详见 ci.yml 同注释）
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # 自动生成 changelog
          files: dist/**

