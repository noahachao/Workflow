# Release：Release 发布 → 测试 → 构建 → 产物附加到该 Release → 部署（CD 挂载点）
# 由 Release Please 触发（它负责版本号/CHANGELOG/tag/创建 Release，本流程负责产物与部署）
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write # 创建 Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # 统一 npm 大版本，避免与本地 lock 生成版本分裂（详见 ci.yml 同注释）
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: 附加构建产物到 Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**

