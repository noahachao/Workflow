# Pi：@pi 机器人 —— 在 Issue/PR 评论里 @pi，本地同款 coding agent 在云端干活
# pi 文档：https://pi.dev  |  npm: @earendil-works/pi-coding-agent
#
# 前提：仓库 Settings → Secrets → Actions 添加任一模型的 API Key：
#   ZAI_CODING_CN_API_KEY（智谱 GLM Coding 套餐，包月不按 token 计费 ← 默认）
#   DEEPSEEK_API_KEY（DeepSeek，按量备用）
#   pi 支持几十家 provider，见 README 的 Providers & Models 一节。
#
# 注意：CI 里只能用 API key（按 token 计费）；本地才能用订阅登录（/login）。
name: Pi

on:
  issue_comment:
    types: [created]

jobs:
  pi:
    # 双重门禁：①评论含 @pi ②评论者是 OWNER/COLLABORATOR
    # （公开仓库下若只看内容，任何陌生人都能烧你的 API key + 驱动 write 权限）
    if: >-
      contains(github.event.comment.body, '@pi') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    permissions:
      contents: write # push 分支
      pull-requests: write # 创建/更新 PR
      issues: write # 回复评论

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prepare branch (issue vs PR context)
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "pi-bot"
          git config user.email "pi-bot@users.noreply.github.com"
          # 评论在 PR 上 → 检出该 PR 分支继续改；在 Issue 上 → 新建工作分支
          if gh pr view "$ISSUE_NUMBER" >/dev/null 2>&1; then
            echo "CONTEXT=pr" >> "$GITHUB_ENV"
            gh pr checkout "$ISSUE_NUMBER"
          else
            echo "CONTEXT=issue" >> "$GITHUB_ENV"
            git checkout -b "pi/issue-$ISSUE_NUMBER"
          fi

      - name: Run pi
        env:
          # ★ 默认走智谱 GLM Coding 套餐（包月）；想切 DeepSeek 改 --provider deepseek
          ZAI_CODING_CN_API_KEY: ${{ secrets.ZAI_CODING_CN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          COMMENT: ${{ github.event.comment.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CONTEXT: ${{ env.CONTEXT }}
        run: |
          npx -y @earendil-works/pi-coding-agent \
            --provider zai-coding-cn --model glm-5.3 \
            --mode json \
            -p "
          你是在仓库中工作的 coding agent。遵守 AGENTS.md 的全部硬性规则。

          任务（来自 GitHub ${CONTEXT} #${ISSUE_NUMBER}《${ISSUE_TITLE}》）：
          ${COMMENT}

          Issue 详情：
          ${ISSUE_BODY}

          要求：
          1. 实现任务并附带测试，npm test 必须全绿
          2. 提交改动（不要 push）
          3. 只做任务要求的事，不做无关重构
          "

      - name: Push & open PR (issue 场景)
        if: env.CONTEXT == 'issue'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # 检测产出：比较当前分支与 main 的 commit 差（pi 会先 commit，工作区可能已干净）
          if git rev-list --count origin/main..HEAD | grep -q '^0$'; then
            gh issue comment "$ISSUE_NUMBER" --body "π 无改动产生，请检查任务描述。"
            exit 0
          fi
          git push -u origin "pi/issue-$ISSUE_NUMBER"
          gh pr create \
            --title "fix #${ISSUE_NUMBER}: $(git log -1 --format=%s)" \
            --body "由 @pi 根据 #${ISSUE_NUMBER} 自动实现。Closes #${ISSUE_NUMBER}" \
            --base main

      - name: Push updates (PR 场景)
        if: env.CONTEXT == 'pr'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # 同上：以 commit 差为准；若有未提交改动（pi 未 commit）则补一个 commit
          NEED=0
          [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ] 2>/dev/null && NEED=1
          git status --porcelain | grep -q . && NEED=1
          if [ "$NEED" = "0" ]; then
            gh pr comment "$ISSUE_NUMBER" --body "π 无改动产生。"
            exit 0
          fi
          git commit -am "pi: 后续修改" >/dev/null 2>&1 || true
          git push
          gh pr comment "$ISSUE_NUMBER" --body "π 已按评论更新。"

# ⚠️ 安全提示：Issue/评论内容会进入 prompt，存在 prompt injection 风险。
# 已设身份门禁（仅 OWNER/COLLABORATOR 可触发）；产物仍需过 CI + 人工 review 才能合并，
# 保持“AI 无合并权”原则。
