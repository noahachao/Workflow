# 安全扫描（免费，私有仓库可用）：密钥泄露 + 依赖漏洞
# CodeQL 属付费 GHAS 仅公开仓库免费（见 codeql.yml），这里是私有仓库的安全兜底。
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # gitleaks-action 在 PR 事件下需读 PR commits 列表，缺此权限会 403
  security-events: write # 上传结果到 Security 标签页

jobs:
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 扫全历史
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 个人（1 committer）免费；组织多成员时需 license

  audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # 不用 cache: npm——无 package-lock 的库会炸（setup-node 要求 lock 存在）
      # 无 package-lock.json 的库（python/go 等）自动跳过；critical 漏洞阻断，
      # high 级建议立 issue 走升级流程，避免大版本强制升级破坏兼容
      - name: npm audit（npm ci + audit）
        run: |
          if [ ! -f package-lock.json ]; then
            echo "非 node 项目，跳过 npm audit"
            exit 0
          fi
          npm ci
          npm audit --audit-level=critical
