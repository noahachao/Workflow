# Release Please：conventional commits → 自动维护「Release PR」（版本号 + CHANGELOG）
# 流程：代码 PR 合并 → 本机器人更新 Release PR → 你签章合并 → 自动打 tag + 发布 Release
# 提交规范：feat: 升次版本 / fix: 升修订版 / feat!: 或 BREAKING CHANGE: 升主版本
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write      # 创建 tag / Release / Release PR
  pull-requests: write # 维护 Release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # PAT（= 仓库主人身份）创建 tag/Release —— GITHUB_TOKEN 打的 tag 不触发
          # 其他 workflow（防火墙），导致 release.yml 产物挂载永不运行
          token: ${{ secrets.WORKFLOW_PAT }}
          # 单包 node 项目；其他语言仓库 apply 时按需改（python/go/rust 同样支持）
          release-type: node
          # Release PR 标题与正文风格
          include-v-in-tag: true
