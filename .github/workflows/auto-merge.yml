# 标签式自动合并（免费替代 GitHub Pro 的分支保护 + auto-merge）
# 用法：PR 上打 approved 标签 = 你的签章 → 本 workflow 等 CI 全绿 → 自动 squash 合并并删分支
# 双通道：①事件触发（打标签/新提交，秒级） ②每 5 分钟轮询兜底（API 打标签不触发 labeled 事件的怪癖免疫）
# 安全性：只有对仓库有写权限的人（你）能打标签；CI 有红灯则拒绝合并
name: Auto Merge (approved)

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  schedule:
    - cron: "*/5 * * * *" # 轮询兜底：扫一遍所有带 approved 标签的开放 PR
  workflow_dispatch: # 支持手动触发（测试用）

permissions:
  contents: write # 合并 + 删分支
  pull-requests: write
  issues: write # 合并后补刀关 issue（GITHUB_TOKEN 建 PR 的 Closes #N 被 GitHub 忽略）

# 防轮询叠加：慢 run 跨过下一个 cron 点时排队执行，不并发双跑抢同一 PR
concurrency:
  group: auto-merge-sweep
  cancel-in-progress: false

jobs:
  merge:
    name: 扫描已签章 PR 并合并
    # 事件模式下仅处理带 approved 标签的 PR；轮询/手动模式直接全量扫描
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.state == 'open' &&
       contains(join(github.event.pull_request.labels.*.name, ','), 'approved'))
    runs-on: ubuntu-latest
    steps:
      - name: 扫描带 approved 标签的 PR，等 CI 全绿后合并
        env:
          # PAT（用户身份）：--admin 通道 + bypass ruleset；GITHUB_TOKEN 无此权限
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PRS=$(gh pr list -R "$REPO" --label approved --state open --json number --jq '.[].number' || true)
          if [ -z "${PRS:-}" ]; then echo "无待合并 PR"; exit 0; fi
          for NUM in $PRS; do
            echo "── PR #$NUM：检查当前状态 ──"
            # 只看真 CI 成绩：忽略本 workflow 自身产生的 check（pending/尸 fail 不再自锁），
            # 且只要还有非 SUCCESS 的真检查就跳过，下轮轮询再看
            # 零 checks 的 PR（如 GITHUB_TOKEN 机器人开的）会让 gh pr checks 非零退出——
            # set -e 下将炸死整个 sweep 循环，必须兜底为“跳过、下轮再看”
            NOT_GREEN=$(gh pr checks "$NUM" -R "$REPO" --json name,state \
              --jq '[.[] | select(.name != "扫描已签章 PR 并合并") | select(.state != "SUCCESS")] | length' 2>/dev/null) || NOT_GREEN=1
            if [ "${NOT_GREEN:-1}" = "0" ]; then
              # 单个 PR 合并失败（ruleset 拒/冲突/竞态）只告警，不炸循环
              # 先走普通通道；被 ruleset 拒（GITHUB_TOKEN 机器人 PR 无 CI 记录，required checks 永不满足）则 admin 重试
              if gh pr merge "$NUM" -R "$REPO" --squash --delete-branch \
                || gh pr merge "$NUM" -R "$REPO" --squash --delete-branch --admin; then
                echo "✅ #$NUM 已合并"
                # GITHUB_TOKEN 创建的 PR，其 Closes #N 会被 GitHub 忽略（防机器人递归）——补刀关 issue
                ISSUE=$(gh pr view "$NUM" -R "$REPO" --json title --jq '.title' | grep -oE '#[0-9]+' | head -1 | tr -d '#')
                if [ -n "$ISSUE" ]; then
                  gh issue close "$ISSUE" -R "$REPO" --comment "已由 PR #$NUM（@pi 自动实现）合并关闭。" >/dev/null 2>&1 \
                    && echo "✅ issue #$ISSUE 已随合并关闭" \
                    || echo "::warning::#$ISSUE 关闭失败（可能已关或非 issue PR），下轮再看"
                fi
              else
                echo "::warning::#$NUM 合并被拒，下轮再看"
              fi
            else
              echo "::warning::PR #$NUM 有 $NOT_GREEN 项未全绿（真 CI），下轮再看"
            fi
          done
