# 标签式自动合并（免费替代 GitHub Pro 的分支保护 + auto-merge）
# 用法：PR 上打 approved 标签 = 你的签章 → 本 workflow 等 CI 全绿 → 自动 squash 合并并删分支
# 双通道：①事件触发（打标签/新提交，秒级） ②每日轮询兜底（API 打标签不触发 labeled 事件的怪癖免疫）
# 安全性：只有对仓库有写权限的人（你）能打标签；CI 有红灯则拒绝合并
name: Auto Merge (approved)

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  schedule:
    - cron: "0 5 * * *" # 轮询兜底：扫一遍所有带 approved 标签的开放 PR
  workflow_dispatch: # 支持手动触发（测试用）

permissions:
  contents: write # 合并 + 删分支
  pull-requests: write
  issues: write # 合并后补刀关 issue（GITHUB_TOKEN 建 PR 的 Closes #N 被 GitHub 忽略）
  actions: write # 配额守卫自禁用时的兑底令牌（PAT 优先）

# 防轮询叠加：慢 run 跨过下一个 cron 点时排队执行，不并发双跑抢同一 PR
concurrency:
  group: auto-merge-sweep
  cancel-in-progress: false

jobs:
  merge:
    name: 扫描已签章 PR 并合并
    # 事件模式下仅处理带 approved 标签的 PR；轮询/手动模式直接全量扫描
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.state == 'open' &&
       contains(join(github.event.pull_request.labels.*.name, ','), 'approved'))
    runs-on: ubuntu-latest
    steps:
      # 配额守卫：GitHub Free 每月含 2000 分钟，耗尽后 job 拒启但 run 照常创建 → 每天一封失败邮件轰炸。
      # 守卫在还能跑的时候自查余额，低于阈值就自禁用（exit 0 静默，不发失败通知），
      # 等每月 1 日由 quota-resume.yml 自动重启（免费额度按自然月重置）。
      # 计费 API 需 PAT 的 user 权限——WORKFLOW_PAT 没有时降级为“查不到就继续跑”（守卫失效但不影响合并）。
      - id: quota
        name: 配额守卫（余额不足自禁用，月初自动恢复）
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          FALLBACK_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          THRESHOLD=150
          BILLING=$(gh api "/users/${GITHUB_ACTOR}/settings/billing/actions" 2>/dev/null) || BILLING=""
          if [ -z "$BILLING" ]; then
            echo "计费 API 不可用（PAT 缺 user 权限），跳过守卫继续执行"
            echo "stop=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          INCLUDED=$(echo "$BILLING" | jq -r '.included_minutes')
          USED=$(echo "$BILLING" | jq -r '.total_minutes_used')
          LEFT=$((INCLUDED - USED))
          echo "本月已用 ${USED}/${INCLUDED} 分钟，剩余 ${LEFT}（阈值 ${THRESHOLD}）"
          if [ "$LEFT" -ge "$THRESHOLD" ]; then
            echo "stop=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "余额低于阈值，自禁用 auto-merge，等下月 1 日 quota-resume 重启"
          if ! gh api -X PUT "repos/${REPO}/actions/workflows/auto-merge.yml/disable" 2>/dev/null; then
            if ! curl -fsSL -X PUT -H "Authorization: Bearer ${FALLBACK_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/workflows/auto-merge.yml/disable"; then
              echo "::warning::自禁用失败（两种令牌均被拒），守卫退出但下轮 sweep 可能继续消耗配额"
              echo "stop=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "✅ 已自禁用，恢复静默"
          echo "stop=true" >> "$GITHUB_OUTPUT"
      - name: 扫描带 approved 标签的 PR，等 CI 全绿后合并
        if: steps.quota.outputs.stop != 'true'
        env:
          # PAT（用户身份）：--admin 通道 + bypass ruleset；GITHUB_TOKEN 无此权限
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PRS=$(gh pr list -R "$REPO" --label approved --state open --json number --jq '.[].number' || true)
          if [ -z "${PRS:-}" ]; then echo "无待合并 PR"; exit 0; fi
          for NUM in $PRS; do
            echo "── PR #$NUM：检查当前状态 ──"
            # 只看真 CI 成绩：忽略本 workflow 自身产生的 check（pending/尸 fail 不再自锁），
            # 且只要还有非 SUCCESS 的真检查就跳过，下轮轮询再看
            # 零 checks 的 PR（如 GITHUB_TOKEN 机器人开的）会让 gh pr checks 非零退出——
            # set -e 下将炸死整个 sweep 循环，必须兜底为“跳过、下轮再看”
            NOT_GREEN=$(gh pr checks "$NUM" -R "$REPO" --json name,state \
              --jq '[.[] | select(.name != "扫描已签章 PR 并合并") | select(.state != "SUCCESS")] | length' 2>/dev/null) || NOT_GREEN=1
            if [ "${NOT_GREEN:-1}" = "0" ]; then
              # 单个 PR 合并失败（ruleset 拒/冲突/竞态）只告警，不炸循环
              # 先走普通通道；被 ruleset 拒（GITHUB_TOKEN 机器人 PR 无 CI 记录，required checks 永不满足）则 admin 重试
              if gh pr merge "$NUM" -R "$REPO" --squash --delete-branch \
                || gh pr merge "$NUM" -R "$REPO" --squash --delete-branch --admin; then
                echo "✅ #$NUM 已合并"
                # GITHUB_TOKEN 创建的 PR，其 Closes #N 会被 GitHub 忽略（防机器人递归）——补刀关 issue
                # 标题无 #数字（如纯中文标题）时 grep 退出 1，set -e+pipefail 会炸死整个 job
                # （合并已成功却报 failure）——必须兜底
                ISSUE=$(gh pr view "$NUM" -R "$REPO" --json title --jq '.title' | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
                if [ -n "$ISSUE" ]; then
                  gh issue close "$ISSUE" -R "$REPO" --comment "已由 PR #$NUM（@pi 自动实现）合并关闭。" >/dev/null 2>&1 \
                    && echo "✅ issue #$ISSUE 已随合并关闭" \
                    || echo "::warning::#$ISSUE 关闭失败（可能已关或非 issue PR），下轮再看"
                fi
              else
                echo "::warning::#$NUM 合并被拒，下轮再看"
              fi
            else
              echo "::warning::PR #$NUM 有 $NOT_GREEN 项未全绿（真 CI），下轮再看"
            fi
          done
