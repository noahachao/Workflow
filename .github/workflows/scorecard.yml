# OSSF Scorecard：开源安全最佳实践评分（公开库专用，免费）
# 作用：给仓库打安全成熟度分（0-10）并出徽章，可挂到 README 展示
name: OSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # 每周一凌晨刷新（UTC）
  workflow_dispatch:

permissions:
  security-events: write # 上传 SARIF 扫描结果
  contents: read

jobs:
  analysis:
    # 私有库跑无意义且多项检查会失败，仅公开库执行
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - name: 运行 Scorecard 分析
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: results.sarif
          results_format: sarif
          # 发布到公开排行榜（公开库专属福利，可获得徽章）
          publish_results: false

      - name: 上传 SARIF 到代码扫描
        uses: github/codeql-action/upload-sarif@7999b86c43a865dc79d8923397f35af22de63401
        with:
          sarif_file: results.sarif
