# Dependabot：依赖自动升级 + 安全修复
# 文档：https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # GitHub Actions 自身升级（workflow 里用的 action 版本）  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(deps)"

  # npm 依赖升级
    ignore-conditions:
      - dependency-name: "googleapis/release-please-action"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    # minor/patch 合并成单 PR——一次 CI 验证一批，砍 80% 触发次数
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # 按语言扩展（示例）：
  # - package-ecosystem: "pip"
  #   directory: "/"
  #   schedule: { interval: "weekly" }
  # - package-ecosystem: "docker"
  #   directory: "/"
  #   schedule: { interval: "weekly" }
    ignore-conditions:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "echarts"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nodemailer"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/jest-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vue-router"
        update-types: ["version-update:semver-major"]
